[project]
name = "python-rag-service"
version = "0.1.0"
description = "Agentic-RAG Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "langgraph>=0.4.0",
    "qdrant-client>=1.13.0",
    "minio>=7.2.0",
    "unstructured>=0.16.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "openai>=1.68.0",
]

[project.scripts]
start = "uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-mock>=3.14.0",
    "mypy>=1.15.0",
    "ruff>=0.9.0",
]
