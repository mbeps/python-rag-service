name: Pull Request

on:
  pull_request:
    branches:
      - master

env:
  # OpenAI-compatible API configuration
  OPENAI_BASE_URL: https://openrouter.ai/api/v1
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GENERATION_MODEL: ${{ secrets.GENERATION_MODEL }}
  EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
  EMBEDDING_DIMENSIONS: ${{ secrets.EMBEDDING_DIMENSIONS }}
  
  # Knowledge base matching threshold
  DYNAMIC_KB_THRESHOLD: ${{ secrets.EB_MATCH_THRESHOLD }}
  
  # Qdrant configuration
  QDRANT_HOST: ${{ secrets.QDRANT_HOST }}
  QDRANT_PORT: ${{ secrets.QDRANT_PORT }}
  
  # MinIO configuration
  MINIO_ENDPOINT: ${{ secrets.MINIO_ENDPOINT }}
  MINIO_ACCESS_KEY: ${{ secrets.MINIO_ACCESS_KEY }}
  MINIO_SECRET_KEY: ${{ secrets.MINIO_SECRET_KEY }}
  MINIO_VISUAL_BUCKET: ${{ secrets.MINIO_BUCKET }}

jobs:
  lint:
    name: Ruff Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true
          
      - name: Install dependencies
        run: uv sync --dev
        
      - name: Ruff Lint Check
        run: uv run ruff check .
        
      - name: Ruff Format Check
        run: uv run ruff format --check .

  type:
    name: MyPy Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true
          
      - name: Install dependencies
        run: uv sync --dev
        
      - name: MyPy Type Check
        run: uv run mypy .

  pyrefly:
    name: Pyrefly Language Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true
          
      - name: Install dependencies
        run: uv sync --dev
        
      - name: Pyrefly Language Check
        run: uv run pyrefly check

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint, type, pyrefly]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true
          
      - name: Install dependencies
        run: uv sync --dev
      
      - name: Create .env from workflow environment
        run: |
          # Validate required secrets
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "Error: OPENAI_API_KEY secret is not set"
            exit 1
          fi
          
          # Create .env from environment variables
          {
            echo "# CI/CD Environment Configuration"
            echo "# Auto-generated from GitHub Actions workflow environment"
            echo ""
            echo "# OpenAI-compatible API configuration"
            echo "OPENAI_BASE_URL=${{ env.OPENAI_BASE_URL }}"
            echo "OPENAI_API_KEY=${{ env.OPENAI_API_KEY }}"
            if [ -n "${{ env.GENERATION_MODEL }}" ]; then echo "GENERATION_MODEL=${{ env.GENERATION_MODEL }}"; fi
            if [ -n "${{ env.EMBEDDING_MODEL }}" ]; then echo "EMBEDDING_MODEL=${{ env.EMBEDDING_MODEL }}"; fi
            if [ -n "${{ env.EMBEDDING_DIMENSIONS }}" ]; then echo "EMBEDDING_DIMENSIONS=${{ env.EMBEDDING_DIMENSIONS }}"; fi
            echo ""
            echo "# Knowledge base matching threshold"
            if [ -n "${{ env.DYNAMIC_KB_THRESHOLD }}" ]; then echo "DYNAMIC_KB_THRESHOLD=${{ env.DYNAMIC_KB_THRESHOLD }}"; fi
            echo ""
            echo "# Qdrant configuration"
            if [ -n "${{ env.QDRANT_HOST }}" ]; then echo "QDRANT_HOST=${{ env.QDRANT_HOST }}"; fi
            if [ -n "${{ env.QDRANT_PORT }}" ]; then echo "QDRANT_PORT=${{ env.QDRANT_PORT }}"; fi
            echo ""
            echo "# MinIO configuration"
            if [ -n "${{ env.MINIO_ENDPOINT }}" ]; then echo "MINIO_ENDPOINT=${{ env.MINIO_ENDPOINT }}"; fi
            if [ -n "${{ env.MINIO_ACCESS_KEY }}" ]; then echo "MINIO_ACCESS_KEY=${{ env.MINIO_ACCESS_KEY }}"; fi
            if [ -n "${{ env.MINIO_SECRET_KEY }}" ]; then echo "MINIO_SECRET_KEY=${{ env.MINIO_SECRET_KEY }}"; fi
            if [ -n "${{ env.MINIO_VISUAL_BUCKET }}" ]; then echo "MINIO_VISUAL_BUCKET=${{ env.MINIO_VISUAL_BUCKET }}"; fi
          } > .env
              
      - name: Run Test Suite
        run: uv run pytest
      