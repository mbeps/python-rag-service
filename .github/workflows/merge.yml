name: Pull Request

on:
  pull_request:
    branches:
      - master

env:
  # OpenAI-compatible API configuration
  OPENAI_BASE_URL: https://openrouter.ai/api/v1
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  GENERATION_MODEL: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
  EMBEDDING_MODEL: nvidia/nemotron-3-embed-1b:free
  EMBEDDING_DIMENSIONS: "2048"
  
  # Knowledge base matching threshold
  DYNAMIC_KB_THRESHOLD: "0.65"
  
  # Qdrant configuration (matches docker-compose service names)
  QDRANT_HOST: localhost
  QDRANT_PORT: "6333"
  
  # MinIO configuration (matches docker-compose service names)
  MINIO_ENDPOINT: localhost:9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  MINIO_VISUAL_BUCKET: rag-assets

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
          enable-cache: true
          
      - name: Install dependencies
        run: uv sync --dev
        
      - name: Ruff Lint Check
        run: uv run ruff check .
        
      - name: Ruff Format Check
        run: uv run ruff format --check .
        
      - name: MyPy Type Check
        run: uv run mypy .
        
      - name: Pyrefly Architecture Check
        run: uv run pyrefly check
      
      - name: Create .env from workflow environment
        run: |
          # Validate required secrets
          if [ -z "${{ secrets.OPENAI_API_KEY }}" ]; then
            echo "Error: OPENAI_API_KEY secret is not set"
            exit 1
          fi
          
          # Create .env from environment variables
          {
            echo "# CI/CD Environment Configuration"
            echo "# Auto-generated from GitHub Actions workflow environment"
            echo ""
            echo "# OpenAI-compatible API configuration"
            echo "OPENAI_BASE_URL=${{ env.OPENAI_BASE_URL }}"
            echo "OPENAI_API_KEY=${{ env.OPENAI_API_KEY }}"
            echo "GENERATION_MODEL=${{ env.GENERATION_MODEL }}"
            echo "EMBEDDING_MODEL=${{ env.EMBEDDING_MODEL }}"
            echo "EMBEDDING_DIMENSIONS=${{ env.EMBEDDING_DIMENSIONS }}"
            echo ""
            echo "# Knowledge base matching threshold"
            echo "DYNAMIC_KB_THRESHOLD=${{ env.DYNAMIC_KB_THRESHOLD }}"
            echo ""
            echo "# Qdrant configuration"
            echo "QDRANT_HOST=${{ env.QDRANT_HOST }}"
            echo "QDRANT_PORT=${{ env.QDRANT_PORT }}"
            echo ""
            echo "# MinIO configuration"
            echo "MINIO_ENDPOINT=${{ env.MINIO_ENDPOINT }}"
            echo "MINIO_ACCESS_KEY=${{ env.MINIO_ACCESS_KEY }}"
            echo "MINIO_SECRET_KEY=${{ env.MINIO_SECRET_KEY }}"
            echo "MINIO_VISUAL_BUCKET=${{ env.MINIO_VISUAL_BUCKET }}"
          } > .env
      
      - name: Start Docker Compose services
        run: docker compose up -d
      
      - name: Wait for services to be healthy
        run: |
          # Wait for Qdrant to be healthy
          for i in {1..30}; do
            curl -f http://localhost:6333/healthz && echo "Qdrant is healthy" && break
            echo "Waiting for Qdrant... ($i/30)"
            sleep 1
          done
          
          # Wait for MinIO to be healthy
          for i in {1..30}; do
            curl -f http://localhost:9000/minio/health/live && echo "MinIO is healthy" && break
            echo "Waiting for MinIO... ($i/30)"
            sleep 1
          done
        
      - name: Run Test Suite
        run: uv run pytest
      
      - name: Stop Docker Compose services
        if: always()
        run: docker compose down -v